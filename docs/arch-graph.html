<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Architecture demo / Intrusion Graph</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0910;
    --panel: #14111b;
    --panel-2: #1b1725;
    --line: #30283e;
    --line-soft: #211c2d;
    --ink: #efe9dc;
    --ink-2: #c9c1d0;
    --muted: #9790a4;
    --coral: #e8896f;
    --teal: #72d3c8;
    --gold: #e9c46a;
    --violet: #a99be8;
    --red: #e0605a;
    --sans: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --ui: "Bahnschrift", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-rows: 50px minmax(0, 1fr);
    background:
      radial-gradient(1000px 700px at 30% 0%, rgba(169, 155, 232, 0.09), transparent 65%),
      radial-gradient(900px 700px at 90% 100%, rgba(114, 211, 200, 0.07), transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 13px/1.5 var(--ui);
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--teal); text-decoration: none; }
  a:hover { color: var(--gold); }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  ::selection { background: var(--gold); color: #0b0910; }
  .mono { font-family: var(--mono); }

  .top {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 9, 16, 0.78);
    backdrop-filter: blur(14px);
    min-width: 0;
  }
  .brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .brand svg { width: 28px; height: 28px; }
  .brand b { font: 600 15px/1 var(--ui); letter-spacing: 0.12em; text-transform: uppercase; }
  .brand span { color: var(--muted); font: 500 8.5px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
  .divider { width: 1px; height: 20px; background: var(--line); }
  .case-tabs { display: flex; align-items: center; gap: 3px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .case-tabs::-webkit-scrollbar { display: none; }
  .case-tab { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 9px; border: 1px solid transparent; background: none; color: var(--muted); font: 500 8px/1 var(--mono); letter-spacing: 0.05em; white-space: nowrap; }
  .case-tab b { color: var(--gold); font-weight: 500; }
  .case-tab:hover { color: var(--ink); border-color: var(--line); }
  .case-tab.on { color: var(--ink); border-color: var(--line); background: rgba(233, 196, 106, 0.07); }
  .grow { flex: 1; }
  .top-tools { display: flex; align-items: center; gap: 4px; }
  .tool { min-height: 28px; padding: 0 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 500 8px/1 var(--mono); letter-spacing: 0.05em; white-space: nowrap; }
  .tool:hover { border-color: var(--teal); color: var(--ink); }
  .tool.on { border-color: var(--coral); color: var(--coral); background: rgba(232, 137, 111, 0.07); }
  .run { color: var(--muted); font: 500 8.5px/1.4 var(--mono); letter-spacing: 0.05em; white-space: nowrap; }
  .run b { color: var(--ink-2); font-weight: 500; }

  .stage { position: relative; min-height: 0; overflow: hidden; }
  .top, .stage, .panel, .panel-body, .chainbar, .map-legend { min-width: 0; }
  .panel-body { overflow-x: hidden; }
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(239,233,220,0.25), transparent 1.5px),
      radial-gradient(1px 1px at 70% 60%, rgba(114,211,200,0.2), transparent 1.5px),
      radial-gradient(1.5px 1.5px at 45% 80%, rgba(233,196,106,0.18), transparent 1.8px);
    background-size: 280px 220px, 340px 260px, 420px 300px;
    opacity: 0.5;
  }
  #graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .edge { stroke: rgba(201, 193, 208, 0.16); stroke-width: 1; transition: opacity 0.2s ease, stroke 0.2s ease, stroke-width 0.2s ease; }
  .edge.case { stroke: rgba(233, 196, 106, 0.28); }
  .edge.host { stroke: rgba(114, 211, 200, 0.22); }
  .edge.gap { stroke: rgba(232, 137, 111, 0.3); stroke-dasharray: 3 5; }
  .edge.fade { opacity: 0.07; }
  .edge.on { stroke: var(--gold); stroke-width: 1.7; opacity: 1; }
  .edge.on.host { stroke: var(--teal); }
  .edge.on.gap { stroke: var(--coral); }
  .node { cursor: pointer; }
  .node .core { transition: r 0.15s ease, stroke 0.15s ease, fill 0.15s ease; }
  .node .ring { fill: none; stroke: rgba(239, 233, 220, 0.18); stroke-width: 1; transition: opacity 0.18s ease, stroke 0.18s ease; }
  .node .halo { fill: transparent; stroke: transparent; stroke-width: 1; transition: stroke 0.18s ease, opacity 0.18s ease; opacity: 0; }
  .node text { fill: var(--ink-2); font: 500 8px var(--mono); letter-spacing: 0.02em; pointer-events: none; }
  .node .name { fill: var(--ink); font: 500 10px var(--ui); letter-spacing: 0.01em; }
  .node .sub { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: 0.04em; }
  .node.case .core { fill: rgba(233, 196, 106, 0.14); stroke: var(--gold); stroke-width: 1.4; }
  .node.case .ring { stroke: rgba(233, 196, 106, 0.3); stroke-dasharray: 2 5; }
  .node.host .core { fill: var(--teal); stroke: #0b0910; stroke-width: 2; }
  .node.host .ring { stroke: rgba(114, 211, 200, 0.32); }
  .node.tech .core { fill: var(--violet); stroke: #0b0910; stroke-width: 1.4; }
  .node.tech .label { opacity: 0.48; }
  .node.tech:hover .label, .node.tech.on .label, .node.tech.near .label, .all-labels .node.tech .label { opacity: 1; }
  .node.gap .core { fill: #0b0910; stroke: var(--coral); stroke-width: 1.5; stroke-dasharray: 2 3; }
  .node.gap .label { fill: var(--coral); opacity: 0.75; }
  .node.gap .ring { stroke: rgba(232, 137, 111, 0.28); stroke-dasharray: 1 4; }
  .node.on .core { r: 0; }
  .node.on .halo { stroke: var(--ink); opacity: 0.9; }
  .node.on .name { fill: var(--ink); }
  .node.on.case .halo { stroke: var(--gold); }
  .node.on.host .halo { stroke: var(--teal); }
  .node.on.tech .halo { stroke: var(--violet); }
  .node.on.gap .halo { stroke: var(--coral); }
  .node.fade { opacity: 0.3; }
  .node.fade .label { opacity: 0.12; }
  .node.near .core { stroke: var(--ink); }
  .node.near .label { opacity: 1; }
  .label { transition: opacity 0.18s ease; }
  .all-labels .node.tech .label { opacity: 0.9; }
  .chain-line { fill: none; stroke: #f6e3ad; stroke-width: 1.5; stroke-dasharray: 5 6; opacity: 0.95; filter: drop-shadow(0 0 4px rgba(233, 196, 106, 0.3)); animation: chain-dash 20s linear infinite; }
  .chain-step { fill: var(--bg); stroke: #f6e3ad; stroke-width: 1.2; }
  .chain-num { fill: #f6e3ad; font: 500 7px var(--mono); text-anchor: middle; }
  @keyframes chain-dash { to { stroke-dashoffset: -220; } }

  .map-legend { position: absolute; z-index: 3; left: 22px; bottom: 62px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 360px; padding: 7px 9px; border: 1px solid var(--line); background: rgba(20, 17, 27, 0.68); backdrop-filter: blur(8px); color: var(--muted); font: 500 7.5px/1.4 var(--mono); letter-spacing: 0.04em; }
  .map-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .map-legend i { width: 7px; height: 7px; border-radius: 50%; }
  .map-legend i.case { background: var(--gold); }
  .map-legend i.host { background: var(--teal); }
  .map-legend i.tech { background: var(--violet); }
  .map-legend i.gap { background: transparent; border: 1px dashed var(--coral); }

  .panel {
    position: absolute;
    z-index: 4;
    top: 18px;
    right: 18px;
    bottom: 62px;
    width: min(372px, calc(100% - 36px));
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    background: rgba(20, 17, 27, 0.86);
    backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
    transition: transform 0.32s var(--ease), opacity 0.22s ease;
  }
  .panel.closed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 38px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--muted); font: 500 8px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
  .panel-head b { color: var(--ink); font-weight: 500; }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--line); }
  .p-kicker { color: var(--muted); font: 500 7.5px/1.4 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
  .p-title { margin: 8px 0 0; font: 400 28px/1.03 var(--sans); letter-spacing: -0.03em; }
  .p-sub { margin: 8px 0 0; color: var(--muted); font: 500 9px/1.5 var(--mono); }
  .p-summary { margin: 14px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; text-wrap: pretty; }
  .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 14px; border: 1px solid var(--line-soft); background: var(--line-soft); }
  .p-grid div { padding: 7px 8px; background: var(--panel); }
  .p-grid dt { color: var(--muted); font: 500 7px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .p-grid dd { margin: 4px 0 0; color: var(--ink); font: 500 9px/1.4 var(--mono); overflow-wrap: anywhere; }
  .p-section { margin-top: 18px; }
  .p-section h3 { margin: 0 0 7px; color: var(--muted); font: 500 7.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
  .p-section p { margin: 0; color: var(--ink-2); font: 500 9.5px/1.6 var(--mono); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { padding: 3px 6px; border: 1px solid rgba(169,155,232,0.32); background: rgba(169,155,232,0.07); color: var(--violet); font: 500 7.5px/1 var(--mono); }
  .chip.gap { border-color: rgba(232,137,111,0.4); background: rgba(232,137,111,0.06); color: var(--coral); }
  .chain { display: grid; gap: 4px; }
  .chain button { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 7px; align-items: center; width: 100%; padding: 6px 7px; border: 1px solid var(--line-soft); background: transparent; color: var(--ink-2); text-align: left; font: 500 8.5px/1.4 var(--mono); }
  .chain button:hover { border-color: var(--gold); color: var(--ink); }
  .chain .n { color: var(--gold); }
  .chain .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chain .v { color: var(--muted); }
  .p-actions { display: flex; gap: 5px; margin-top: 18px; }
  .p-actions .btn { flex: 1; display: grid; place-items: center; min-height: 34px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); font: 500 8px/1 var(--mono); letter-spacing: 0.04em; text-decoration: none; }
  .p-actions .btn:hover { border-color: var(--gold); color: var(--ink); }
  .p-actions .btn.primary { border-color: var(--gold); background: var(--gold); color: #0b0910; }
  .p-empty { display: grid; place-items: center; min-height: 240px; border: 1px dashed var(--line); color: var(--muted); text-align: center; font: 500 9px/1.7 var(--mono); padding: 20px; }

  .zoom { position: absolute; z-index: 3; left: 22px; bottom: 100px; display: flex; gap: 3px; }
  .zoom button { width: 30px; height: 30px; border: 1px solid var(--line); background: rgba(20,17,27,0.72); color: var(--muted); font: 500 13px/1 var(--mono); backdrop-filter: blur(8px); }
  .zoom button:hover { border-color: var(--teal); color: var(--ink); }
  .graph-hint { position: absolute; z-index: 3; left: 22px; bottom: 22px; color: var(--muted); font: 500 7.5px/1.4 var(--mono); letter-spacing: 0.04em; }
  .graph-hint kbd { display: inline-block; min-width: 14px; padding: 1px 3px; border: 1px solid var(--line); color: var(--ink-2); text-align: center; }

  .chainbar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 18px; border-top: 1px solid var(--line); background: rgba(11, 9, 16, 0.84); backdrop-filter: blur(12px); overflow-x: auto; scrollbar-width: none; }
  .chainbar::-webkit-scrollbar { display: none; }
  .chainbar .label { color: var(--muted); font: 500 7.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .chainbar .step { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); font: 500 8px/1 var(--mono); white-space: nowrap; }
  .chainbar .step:hover { border-color: var(--gold); color: var(--ink); }
  .chainbar .step b { color: var(--gold); font-weight: 500; }
  .chainbar .arrow { color: #5e576b; font: 500 9px/1 var(--mono); }
  .chainbar .spacer { flex: 1; }
  .chainbar .tip { color: var(--muted); font: 500 7.5px/1 var(--mono); white-space: nowrap; }
  .closed-panel-btn { display: none; position: absolute; z-index: 4; top: 18px; right: 18px; min-height: 30px; padding: 0 10px; border: 1px solid var(--line); background: rgba(20,17,27,0.8); color: var(--muted); font: 500 8px/1 var(--mono); }
  .closed-panel-btn:hover { border-color: var(--gold); color: var(--ink); }
  .panel.closed ~ .closed-panel-btn { display: block; }

  @media (max-width: 980px) {
    html, body { overflow-x: hidden; }
    body { display: block; height: auto; min-height: 100vh; overflow-y: auto; }
    .top { position: sticky; top: 0; }
    .stage { height: 760px; }
    .panel { width: 330px; }
    .chainbar { position: absolute; }
  }
  @media (max-width: 720px) {
    .brand span, .divider, .case-tabs, .run { display: none; }
    .top { gap: 8px; padding: 0 10px; }
    .top-tools .tool { padding: 0 6px; }
    .stage { height: 760px; }
    .panel { top: auto; right: 12px; bottom: 58px; left: 12px; width: auto; max-height: 58%; }
    .panel.closed { transform: translateY(calc(100% + 70px)); }
    .zoom { display: none; }
    .map-legend { left: 12px; bottom: 58px; max-width: calc(100% - 24px); }
    .graph-hint { display: none; }
    .closed-panel-btn { top: 12px; right: 12px; }
    .chainbar { padding: 0 12px; }
    .chainbar .tip { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>

    <div class="brand">

  <main class="stage">

    <button class="closed-panel-btn" id="openPanel" type="button">Open inspector</button>

    <div class="zoom" aria-label="Graph zoom">

      <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>

    <div class="map-legend">

      <span><i class="tech"></i>technique</span>
      <span><i class="gap"></i>uncovered</span>
    </div>
    <div class="graph-hint"><kbd>+</kbd><kbd>&minus;</kbd> zoom &nbsp; <kbd>G</kbd> gaps &nbsp; <kbd>L</kbd> labels &nbsp; <kbd>Esc</kbd> clear</div>

    <div class="chainbar" id="chainbar">
      <span class="label">Trace</span>
      <span class="tip" id="traceTip">Select a discovery to trace its chain</span>
      <span class="spacer"></span>
      <span class="tip">39 / 45 priority techniques covered</span>
    </div>
  </main>

  const state = { selected: null, selectedType: null, caseId: null, gaps: false, labels: false, panel: true, zoom: 1 };

  function node(id) { return nodeById.get(id); }
  function px(n) { return n.x * W; }
  function py(n) { return n.y * H; }
  function isGap(id) { return node(id)?.type === "gap"; }
  function neighbors(id) {
    const out = new Set();
    LINKS.forEach(([a, b]) => { if (a === id) out.add(b); if (b === id) out.add(a); });
    return out;
  }
  function casesForHost(host) {
    return D.cases.filter((c) => c.hosts.includes(host));
  }
  function alertsForTech(tech) {
    return D.alerts.filter((a) => a.techniques.includes(tech));

  function alertsForHost(host) {
    return D.alerts.filter((a) => a.host === host);
  }

  function renderGraph() {
    const defs = `<defs>
      <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l8 4-8 4z" fill="#e9c46a"/></marker>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>`;
    const edges = LINKS.map(([a, b, kind]) => {
      const na = node(a), nb = node(b);
      if (!na || !nb) return "";
      return `<line class="edge ${kind}" data-a="${esc(a)}" data-b="${esc(b)}" x1="${px(na).toFixed(1)}" y1="${py(na).toFixed(1)}" x2="${px(nb).toFixed(1)}" y2="${py(nb).toFixed(1)}"></line>`;
    }).join("");
    const nodes = NODES.map((n) => {
      const cls = ["node", n.type, n.hidden ? "hidden-node" : ""].join(" ");
      const ringR = n.type === "case" ? n.r + 10 : n.type === "host" ? n.r + 6 : n.r + 4;
      const haloR = n.type === "case" ? n.r + 14 : n.r + 8;
      const labelX = n.type === "tech" || n.type === "gap" ? n.r + 7 : 0;
      const labelY = n.type === "tech" || n.type === "gap" ? 3 : n.type === "case" ? -(n.r + 18) : n.r + 17;
      const anchor = n.type === "tech" || n.type === "gap" ? "start" : "middle";
      const labelClass = n.type === "tech" || n.type === "gap" ? "label" : "";
      return `<g class="${cls}" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label + " / " + n.sub)}" ${n.hidden ? 'style="display:none"' : ""}>
        <circle class="ring" cx="${px(n).toFixed(1)}" cy="${py(n).toFixed(1)}" r="${ringR}"></circle>
        <circle class="halo" cx="${px(n).toFixed(1)}" cy="${py(n).toFixed(1)}" r="${haloR}"></circle>
        <circle class="core" cx="${px(n).toFixed(1)}" cy="${py(n).toFixed(1)}" r="${n.r}"></circle>
        <text class="name" x="${(px(n) + labelX).toFixed(1)}" y="${(py(n) + labelY).toFixed(1)}" text-anchor="${anchor}">${esc(n.label)}</text>
        ${n.type === "tech" || n.type === "gap" ? `<text class="${labelClass}" x="${(px(n) + labelX).toFixed(1)}" y="${(py(n) + labelY + 10).toFixed(1)}" text-anchor="${anchor}" style="font-size:6.5px">${esc(n.sub)}</text>` : `<text class="sub" x="${px(n).toFixed(1)}" y="${(py(n) + labelY + 10).toFixed(1)}" text-anchor="middle">${esc(n.sub)}</text>`}
      </g>`;
    }).join("");
    svg.innerHTML = defs + `<g id="edges">${edges}</g><g id="nodes">${nodes}</g><g id="chain"></g><g id="gapRing"></g>`;
  }

  function setZoom(value) {
    state.zoom = Math.max(0.72, Math.min(1.7, value));
    const w = W / state.zoom, h = H / state.zoom;
    svg.setAttribute("viewBox", `${(W - w) / 2} ${(H - h) / 2} ${w} ${h}`);
  }

  function clearHighlight() {
    $$(".node").forEach((n) => n.classList.remove("on", "near", "fade"));
    $$(".edge").forEach((e) => e.classList.remove("on", "fade"));
    $("#chain").innerHTML = "";
  }

  function highlight(id) {
    clearHighlight();
    const near = neighbors(id);
    $$(".node").forEach((n) => {
      const nid = n.dataset.id;
      const isOn = nid === id;
      const isNear = near.has(nid) || (isOn && isGap(nid));
      n.classList.toggle("on", isOn);
      n.classList.toggle("near", isNear && !isOn);
      n.classList.toggle("fade", !isOn && !isNear);
    });
    const isCase = node(id)?.type === "case";
    $$(".edge").forEach((e) => {
      const a = e.dataset.a, b = e.dataset.b;
      let on = a === id || b === id;
      if (isCase) {
        const other = a === id ? b : a;
        on = on && node(other)?.type === "host";
      }
      e.classList.toggle("on", on);
      e.classList.toggle("fade", !on);
    });
  }

  function chainFor(caseId) {
    const chain = CHAINS[caseId] || [];
    if (!chain.length) return;
    const group = $("#chain");
    const points = chain.map((id) => node(id)).filter(Boolean).map((n) => [px(n), py(n)]);
    if (points.length < 2) return;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("class", "chain-line");
    path.setAttribute("d", points.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" "));
    path.setAttribute("marker-end", "url(#arrow)");
    group.appendChild(path);
    points.forEach((p, i) => {
      const circle = document.createElementNS(NS, "circle");
      circle.setAttribute("cx", p[0]);
      circle.setAttribute("cy", p[1]);
      circle.setAttribute("r", 8);
      circle.setAttribute("class", "chain-step");
      group.appendChild(circle);
      const text = document.createElementNS(NS, "text");
      text.setAttribute("x", p[0]);
      text.setAttribute("y", p[1] + 2.5);
      text.setAttribute("class", "chain-num");
      text.textContent = String(i + 1);
      group.appendChild(text);
    });
  }

  function trace(caseId) {
    const bar = $("#chainbar");
    $$(".step, .arrow", bar).forEach((n) => n.remove());
    $("#chain").innerHTML = "";
    $("#traceTip").style.display = caseId ? "none" : "";
    if (!caseId) {
      $("#traceTip").textContent = "Select a discovery to trace its chain";
      return;
    }
    $("#traceTip").textContent = "";
    const chain = CHAINS[caseId] || [];
    chainFor(caseId);
    chain.forEach((id, i) => {
      if (i) {
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "→";
        bar.insertBefore(arrow, $(".spacer", bar));
      }
      const button = document.createElement("button");
      button.type = "button";
      button.className = "step";
      button.dataset.node = id;
      const n = node(id);
      button.innerHTML = "<b>" + String(i + 1).padStart(2, "0") + "</b> " + esc(n?.label || id);
      bar.insertBefore(button, $(".spacer", bar));
    });
  }

    const name = techNames[tech] || "Technique";
    const alerts = alertsForTech(tech);
    const hosts = [...new Set(alerts.map((a) => a.host))];
    const gap = isGap(tech) || D.coverage.gaps.some((g) => g.technique === tech);
    let summary;
    if (gap) {
      summary = '<p class="p-summary">This technique is in the 45-technique priority set but no Sigma rule or correlation covers it. It appears in the discovery chain where the case evidence depends on it.</p>';
    } else {
      const total = alerts.reduce((n, a) => n + a.count, 0);
      summary = '<dl class="p-grid"><div><dt>Hosts</dt><dd>' + esc(hosts.join(", ")) + "</dd></div>" +

  function renderPanel() {
    if (state.selectedType === "case") renderCasePanel(state.caseId);
    else if (state.selectedType === "host") renderHostPanel(state.selected);
    else if (state.selectedType === "tech" || state.selectedType === "gap") renderTechPanel(state.selected);
    else renderDefaultPanel();
  }

  function selectNode(id, fromCase = false) {
    const n = node(id);
    if (!n) return;
    state.selected = id;
    state.selectedType = n.type === "gap" ? "gap" : n.type;
    if (n.type === "case") {
      state.caseId = n.caseId;
    } else {
      state.caseId = null;
    }
    highlight(id);
    trace(state.caseId);
    renderPanel();
    if (!fromCase && !state.panel) togglePanel(true);
  }

  function selectCase(caseId) {
    const n = NODES.find((x) => x.caseId === caseId);
    if (!n) return;
    selectNode(n.id);
    $$(".case-tab").forEach((t) => t.classList.toggle("on", t.dataset.case === caseId));
  }

  function togglePanel(force) {
    state.panel = typeof force === "boolean" ? force : !state.panel;
    $("#panel").classList.toggle("closed", !state.panel);
    $("#panelBtn").setAttribute("aria-pressed", String(state.panel));
    $("#panelBtn").classList.toggle("on", !state.panel);
  }

  function toggleGaps() {
    state.gaps = !state.gaps;
    $("#gapsBtn").classList.toggle("on", state.gaps);
    $("#gapsBtn").setAttribute("aria-pressed", String(state.gaps));
    NODES.filter((n) => n.hidden).forEach((n) => {
      const el = document.querySelector('[data-id="' + CSS.escape(n.id) + '"]');
      if (el) el.style.display = state.gaps ? "" : "none";
    });
    const group = $("#gapRing");
    if (!group) return;
    group.innerHTML = "";
    if (state.gaps) {
      const ellipse = document.createElementNS(NS, "ellipse");
      ellipse.setAttribute("cx", "0.48" * W);
      ellipse.setAttribute("cy", "0.86" * H);
      ellipse.setAttribute("rx", "0.22" * W);
      ellipse.setAttribute("ry", "0.075" * H);
      ellipse.setAttribute("fill", "none");
      ellipse.setAttribute("stroke", "rgba(232,137,111,0.25)");
      ellipse.setAttribute("stroke-dasharray", "3 6");
      group.appendChild(ellipse);
      const text = document.createElementNS(NS, "text");
      text.setAttribute("x", "0.48" * W);
      text.setAttribute("y", "0.94" * H);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", "rgba(232,137,111,0.55)");
      text.setAttribute("font-size", "7");
      text.setAttribute("font-family", "Cascadia Mono, monospace");
      text.setAttribute("letter-spacing", "0.14em");
      text.textContent = "UNOBSERVED / 5 MORE PRIORITY TECHNIQUES";
      group.appendChild(text);
    }
  }

  function cycleCase() {
    const ids = ["all", ...D.cases.map((c) => c.id)];
    const current = state.caseId || "all";
    const next = ids[(ids.indexOf(current) + 1) % ids.length];
    if (next === "all") {
      state.selected = null; state.selectedType = null; state.caseId = null;
      clearHighlight(); trace(null); renderPanel();
      $$(".case-tab").forEach((t) => t.classList.toggle("on", t.dataset.case === "all"));
    } else {
      selectCase(next);
    }
  }

  /* events */
  svg.addEventListener("click", (event) => {
    const g = event.target.closest(".node");
    if (g) selectNode(g.dataset.id);
  });
  svg.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const g = event.target.closest(".node");
    if (g) { event.preventDefault(); selectNode(g.dataset.id); }
  });
  $("#panel").addEventListener("click", (event) => {
    const nodeButton = event.target.closest("[data-node]");
    if (nodeButton) { selectNode(nodeButton.dataset.node); return; }
    const techButton = event.target.closest("[data-tech]");
    if (techButton) { selectNode(techButton.dataset.tech); return; }
    const caseButton = event.target.closest("[data-case]");
    if (caseButton) { selectCase(caseButton.dataset.case); return; }
  });
  $(".case-tabs").addEventListener("click", (event) => {
    const tab = event.target.closest("[data-case]");
    if (!tab) return;
    if (tab.dataset.case === "all") {
      state.selected = null; state.selectedType = null; state.caseId = null;
      clearHighlight(); trace(null); renderPanel();
      $$(".case-tab").forEach((t) => t.classList.toggle("on", t === tab));
    } else selectCase(tab.dataset.case);
  });
  $("#chainbar").addEventListener("click", (event) => {
    const step = event.target.closest("[data-node]");
    if (step) selectNode(step.dataset.node);
  });
  $("#gapsBtn").addEventListener("click", toggleGaps);
  $("#labelsBtn").addEventListener("click", () => {
    state.labels = !state.labels;
    $("#labelsBtn").classList.toggle("on", state.labels);
    $("#labelsBtn").setAttribute("aria-pressed", String(state.labels));
    svg.classList.toggle("all-labels", state.labels);
  });
  $("#panelBtn").addEventListener("click", () => togglePanel());
  $("#closePanel").addEventListener("click", () => togglePanel(false));
  $("#openPanel").addEventListener("click", () => togglePanel(true));
  $("#zoomIn").addEventListener("click", () => setZoom(state.zoom + 0.15));
  $("#zoomOut").addEventListener("click", () => setZoom(state.zoom - 0.15));
  $("#zoomReset").addEventListener("click", () => setZoom(1));
  document.addEventListener("keydown", (event) => {
    if (event.target.closest("input, textarea, select")) return;
    if (event.key === "+" || event.key === "=") { event.preventDefault(); setZoom(state.zoom + 0.15); }
    else if (event.key === "-") { event.preventDefault(); setZoom(state.zoom - 0.15); }
    else if (event.key === "g" || event.key === "G") toggleGaps();
    else if (event.key === "l" || event.key === "L") $("#labelsBtn").click();
    else if (event.key === "p" || event.key === "P") togglePanel();
    else if (event.key === "Escape") {
      state.selected = null; state.selectedType = null; state.caseId = null;
      clearHighlight(); trace(null); renderPanel();
      $$(".case-tab").forEach((t) => t.classList.toggle("on", t.dataset.case === "all"));
    } else if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
      event.preventDefault(); cycleCase();
    }
  });

  /* init */
  const CASE_SHORT = { "DL-2026-001": "SSH brute force", "DL-2026-002": "Macro to creds", "DL-2026-003": "Ransomware" };
  $(".case-tabs").insertAdjacentHTML("beforeend", D.cases.map((c, i) => '<button class="case-tab" data-case="' + esc(c.id) + '" type="button"><b>' + String(i + 1).padStart(2, "0") + "</b> " + esc(CASE_SHORT[c.id] || c.hosts[0]) + "</button>").join(""));
  renderGraph();
  renderDefaultPanel();
  setZoom(1);
  // Start on the strongest case so the demo opens with a story, not an empty map.
  selectCase("DL-2026-002");
  if (window.matchMedia("(max-width: 720px)").matches) togglePanel(false);
})();
</script>
</body>
</html>
