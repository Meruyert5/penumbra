# Winlogbeat: run this ON the Windows VM, not in Docker.
#
# 1. Install Sysmon with the SwiftOnSecurity or Olaf Hartong config.
# 2. Copy this file to C:\Program Files\Winlogbeat\winlogbeat.yml
# 3. Set the Elasticsearch host to your lab machine's LAN IP (not localhost).
# 4. PowerShell (admin): .\install-service-winlogbeat.ps1 ; Start-Service winlogbeat
#
# The processors below build the *.caseless fields that the compiled Sigma
# rules use for case-insensitive path matching. Without them, rules that
# reference process.executable.caseless will silently never match.
winlogbeat.event_logs:
  - name: Microsoft-Windows-Sysmon/Operational
    event_id: 1, 3, 10, 11, 12, 13, 22
  - name: Security
    event_id: 4624, 4625, 4672, 4688, 4697, 4720, 4728
  - name: System
    event_id: 7045
  - name: Microsoft-Windows-PowerShell/Operational
    event_id: 4104
  - name: Windows PowerShell
    event_id: 400, 403

processors:
  - copy_fields:
      fields:
        - from: process.executable
          to: process.executable.caseless
      ignore_missing: true
      fail_on_error: false
  - copy_fields:
      fields:
        - from: process.parent.executable
          to: process.parent.executable.caseless
      ignore_missing: true
      fail_on_error: false
  - lowercase:
      fields:
        - process.executable.caseless
        - process.parent.executable.caseless
      ignore_missing: true
      fail_on_error: false

output.elasticsearch:
  hosts: ["http://192.168.56.1:9200"]
  # Uncomment when Winlogbeat and Elasticsearch run the same stack version:
  # setup.template.enabled: true

setup.ilm.enabled: false
logging.level: info
logging.to_files: true
logging.files:
  path: C:\ProgramData\winlogbeat\Logs
