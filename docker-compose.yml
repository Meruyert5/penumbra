# Umbra: single-node Elasticsearch + Kibana + Filebeat.
#
# Security is DISABLED on purpose. This stack is for a local lab only.
# Never expose port 9200 to a network you do not control.
name: umbra

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.15.3}
    container_name: sf-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.ml.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.15.3}
    container_name: sf-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - TELEMETRY_ENABLED=false
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION:-8.15.3}
    container_name: sf-filebeat
    # Optional: only starts with `docker compose --profile beats up -d`.
    # The default quickstart indexes telemetry directly with pipeline/ingest.py,
    # which avoids double-loading the same events.
    profiles: ["beats"]
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./lab/logs:/lab/logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
