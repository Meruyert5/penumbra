id: corr-password-spray
title: Password Spray Across Many Accounts
description: >
  A single source fails authentication against at least eight distinct accounts
  inside ten minutes. The distinct-account requirement separates spraying from a
  brute force against one account.
level: high
technique: T1110.003
index: lab-linux
match:
  message|contains: "Failed password"
group_by: source.ip
distinct_by: user.name
distinct_threshold: 8
window: 10m
threshold: 10
tags:
  - attack.credential_access
  - attack.t1110.003
