name: penumbra-ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Lint rule metadata
        run: python -m pipeline.lint

      - name: Compile Sigma to EQL/KQL
        run: python -m pipeline.compile

      - name: Verify compiled output is committed
        run: python -m pipeline.compile --check

      - name: Regenerate ATT&CK coverage
        run: python -m pipeline.coverage

      - name: Verify coverage report is committed
        run: python -m pipeline.coverage --check

      - name: Regenerate ATT&CK heatmap
        run: python -m pipeline.heatmap

      - name: Verify heatmap is committed
        run: git diff --exit-code docs/assets/attck-heatmap.svg

      - name: Run tests
        run: python -m pytest

      - name: Generate telemetry (smoke test)
        run: python -m pipeline.labgen --scenario all --base-time 2026-11-11T12:30:00Z --out lab/logs

      - name: Run hunts
        run: python -m pipeline.hunts

      - name: Verify hunt output is committed
        run: git diff --exit-code hunts/results.json hunts/README.md

      - name: Evaluate cloud pack
        run: python -m pipeline.cloud_pack

      - name: Verify cloud pack is committed
        run: git diff --exit-code cloud/results.json cloud/README.md

      - name: Render IR casebook
        run: python -m pipeline.casebook

      - name: Verify IR casebook is committed
        run: git diff --exit-code cases/IR.md
