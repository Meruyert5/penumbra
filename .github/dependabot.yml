version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # pysigma 2.x conflicts with pysigma-backend-elasticsearch <2.0.0.
      - dependency-name: "pysigma"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
