# Sigma rule generated for Umbra. Edit the rule, not this comment.
title: Shadow Copy Deletion via VSSAdmin or WMIC
id: d7397f8d-24fe-4e7f-95d9-028446ab3bbd
status: experimental
description: Detects deletion of volume shadow copies, a common step before ransomware encryption because
  it removes the fastest local recovery path.
references:
- https://attack.mitre.org/techniques/T1490/
author: Meruyert
date: 2026/11/11
tags:
- attack.impact
- attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: \vssadmin.exe
    CommandLine|contains: delete
    CommandLine|contains|all:
    - shadows
  selection_wmic:
    Image|endswith: \wmic.exe
    CommandLine|contains|all:
    - shadowcopy
    - delete
  selection_powershell:
    CommandLine|contains|all:
    - Win32_ShadowCopy
    - Delete
  condition: 1 of selection_*
falsepositives:
- Backup software that rotates shadow copies
- Storage administration scripts
level: high
