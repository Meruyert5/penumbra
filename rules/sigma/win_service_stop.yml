title: Critical Service Stopped Before Impact
id: 6d2f9b41-7c38-4e05-a9b6-1f4c8d2e7a53
status: experimental
description: >
  Detects stop events for backup, database, and endpoint protection services.
  Ransomware operators stop these services first so files are not locked and
  backups cannot be restored during encryption.
references:
  - https://attack.mitre.org/techniques/T1489/
author: Meruyert
date: 2026/11/11
tags:
  - attack.impact
  - attack.t1489
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7036
    ServiceName:
      - VSS
      - SQLSERVERAGENT
      - MSSQLSERVER
      - BackupExecAgentBrowser
      - WinDefend
      - Sense
  condition: selection
falsepositives:
  - Administrators stopping a service during maintenance
  - Backup jobs that cycle the agent service
level: high
