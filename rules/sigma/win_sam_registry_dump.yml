# Sigma rule generated for Penumbra. Edit the rule, not this comment.
title: SAM or SECURITY Hive Dumped with Reg.exe
id: 4f3011e1-0e97-40ce-8367-4f684cde4411
status: experimental
description: Detects reg.exe saving the SAM, SECURITY, or SYSTEM hive. Those files contain local password
  hashes and are commonly copied off-host for offline cracking.
references:
- https://attack.mitre.org/techniques/T1003/002/
author: Meruyert
date: 2026/11/11
tags:
- attack.credential_access
- attack.t1003.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_reg:
    Image|endswith: \reg.exe
    CommandLine|contains|all:
    - save
  selection_hive:
    CommandLine|contains:
    - hklm\sam
    - hklm\security
    - hklm\system
  condition: selection_reg and selection_hive
falsepositives:
- Backup tools that export registry hives
- Forensic acquisition performed by an incident responder
level: critical
