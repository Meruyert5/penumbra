# Sigma rule generated for Umbra. Edit the rule, not this comment.
title: Cloud Root Account Console Login
id: 0d807457-1ee7-4556-9e62-8f7360e4e181
status: experimental
description: Detects a successful console login by the cloud root account. Routine work should use named
  identities, so root use warrants review.
references:
- https://attack.mitre.org/techniques/T1078/004/
author: Meruyert
date: 2026/11/11
tags:
- attack.initial_access
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.action: ConsoleLogin
    user.name: root
    event.outcome: success
  condition: selection
falsepositives:
- Break-glass administrative access
- Initial account setup
level: high
