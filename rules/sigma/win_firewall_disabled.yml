# Sigma rule generated for Signal Foundry. Edit the rule, not this comment.
title: Windows Firewall Disabled
id: 85a3552c-fbb2-4705-84c0-bc44e642d862
status: experimental
description: Detects commands that turn off Windows Firewall profiles. Attackers disable the firewall
  before installing remote access or moving laterally.
references:
- https://attack.mitre.org/techniques/T1562/004/
author: Meruyert
date: 2026/11/11
tags:
- attack.defense_evasion
- attack.t1562.004
logsource:
  product: windows
  category: process_creation
detection:
  selection_netsh:
    CommandLine|contains|all:
    - advfirewall
    - set
    CommandLine|contains:
    - 'off'
    - disable
  selection_ps:
    CommandLine|contains|all:
    - Set-NetFirewallProfile
    - Enabled
    - 'False'
  condition: 1 of selection_*
falsepositives:
- Endpoint management tools that temporarily disable a profile
- Troubleshooting scripts
level: medium
