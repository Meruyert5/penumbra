title: SSH Failed Password Authentication
id: 8a4c2f17-5d9b-4e31-a6c8-1e7f3b0d9c42
status: experimental
description: >
  Matches individual failed SSH password attempts. This is intentionally a
  single-event rule: volume-based escalation (brute force) is handled by the
  correlation layer in pipeline/correlate.py so the base rule stays portable
  across SIEMs that do not support threshold aggregations.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Meruyert
date: 2026/11/11
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains|all:
      - 'Failed password'
  condition: selection
falsepositives:
  - Users mistyping passwords
  - Automated scripts with stale credentials
level: low
