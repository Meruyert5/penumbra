# Sigma rule generated for Umbra. Edit the rule, not this comment.
title: PowerShell Download Cradle
id: 7eff5b83-661f-4041-a1b4-6ef9fd6d2083
status: experimental
description: Detects PowerShell that downloads and executes content in one expression. The pattern is
  common in phishing payloads and commodity loaders.
references:
- https://attack.mitre.org/techniques/T1059/001/
- https://attack.mitre.org/techniques/T1105/
author: Meruyert
date: 2026/11/11
tags:
- attack.execution
- attack.t1059.001
- attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  selection_download:
    CommandLine|contains:
    - DownloadString
    - DownloadFile
    - Invoke-WebRequest
    - Net.WebClient
    - IEX(
    - Invoke-Expression
  condition: selection_image and selection_download
falsepositives:
- Software deployment scripts that download installers
- Administrative bootstrap scripts
level: high
