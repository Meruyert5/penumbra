# Sigma rule generated for Umbra. Edit the rule, not this comment.
title: UAC Bypass via Auto-Elevating Binary
id: 75d5c5b4-4439-4f50-8233-aec63d27c69a
status: experimental
description: Detects known auto-elevating Windows binaries spawning a shell. These binaries run at high
  integrity without a prompt and are common UAC bypass hosts.
references:
- https://attack.mitre.org/techniques/T1548/002/
author: Meruyert
date: 2026/11/11
tags:
- attack.privilege_escalation
- attack.t1548.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - \fodhelper.exe
    - \eventvwr.exe
    - \sdclt.exe
    - \computerdefaults.exe
  selection_child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
  condition: selection_parent and selection_child
falsepositives:
- Legacy applications that use these binaries as launchers
- Some vendor installers
level: high
