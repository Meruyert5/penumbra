# Sigma rule generated for Umbra. Edit the rule, not this comment.
title: Rundll32 or Regsvr32 Remote Payload
id: 675424d0-3b84-4a33-bbf0-517041473d85
status: experimental
description: Detects signed Windows binaries loading script or remote content. Rundll32 and Regsvr32 are
  trusted by users and often missed by application allowlists.
references:
- https://attack.mitre.org/techniques/T1218/011/
- https://attack.mitre.org/techniques/T1218/010/
author: Meruyert
date: 2026/11/11
tags:
- attack.defense_evasion
- attack.t1218.011
logsource:
  product: windows
  category: process_creation
detection:
  selection_rundll32:
    Image|endswith: \rundll32.exe
    CommandLine|contains:
    - 'javascript:'
    - http://
    - https://
  selection_regsvr32:
    Image|endswith: \regsvr32.exe
    CommandLine|contains|all:
    - '/i:'
    - http
  condition: 1 of selection_*
falsepositives:
- Legacy installers that register COM components from a URL
- Software deployment scripts
level: high
