# Sigma rule generated for Umbra. Edit the rule, not this comment.
title: Office Application Spawns a Shell
id: e1ae8d6e-b6b2-46a2-86bf-acfabb836f65
status: experimental
description: Detects Word, Excel, or Outlook starting a command interpreter or script host. This parent-child
  pair is a strong signal of a malicious macro.
references:
- https://attack.mitre.org/techniques/T1566/001/
author: Meruyert
date: 2026/11/11
tags:
- attack.initial_access
- attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \OUTLOOK.EXE
    - \POWERPNT.EXE
  selection_child:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \cmd.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
  condition: selection_parent and selection_child
falsepositives:
- Office add-ins that launch a signed helper process
- Macros in approved finance workbooks
level: high
